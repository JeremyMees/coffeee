name: Validate

on:
  workflow_call:

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run eslint
        run: pnpm lint

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run prettier
        run: pnpm format

  typechecking:
    name: Typechecking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run typechecking
        run: pnpm typecheck

  testing:
    name: Testing ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run this shard of the tests
        run: pnpm test:shard --shard=${{ matrix.shard }}/6
      - name: Upload the shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  coverage-gate:
    name: Coverage gate
    needs: testing
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download the shard reports
        uses: actions/download-artifact@v6
        with:
          path: .vitest/blob
          pattern: test-report-*
          merge-multiple: true
      - name: Merge the reports and enforce the coverage thresholds
        run: pnpm test:merge

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffeee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NUXT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coffeee
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run migrations
        run: pnpm db:migrate
      - name: Run Playwright
        run: pnpm test:e2e
