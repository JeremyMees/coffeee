name: Pull request

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  NEON_BRANCH: preview/pr-${{ github.event.number }}

jobs:
  validate:
    name: Validate
    if: github.event.action != 'closed'
    uses: ./.github/workflows/validate.yaml

  preview:
    name: Preview
    needs: validate
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deployment.outputs.preview-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create Neon branch
        id: database
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}
      - name: Run migrations
        run: pnpm db:migrate
        env:
          NUXT_DATABASE_URL: ${{ steps.database.outputs.db_url }}
      - name: Vercel deploy
        id: deployment
        uses: amondnet/vercel-action@v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: lilmees
          github-token: ${{ secrets.GITHUB_TOKEN }}
          env: NUXT_DATABASE_URL=${{ steps.database.outputs.db_url_pooled }}
      - name: Check health
        run: >-
          curl --fail-with-body --silent --show-error
          --header "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          "${{ steps.deployment.outputs.preview-url }}/api/health"

  cleanup:
    name: Delete Neon branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}
