name: Production deploy

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yaml

  deploy:
    name: Deploying
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.preview-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Get production database URLs
        id: database
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          direct=$(pnpm dlx neonctl@8.4.4 connection-string --project-id "$NEON_PROJECT_ID")
          pooled=$(pnpm dlx neonctl@8.4.4 connection-string --project-id "$NEON_PROJECT_ID" --pooled)
          echo "::add-mask::$direct"
          echo "::add-mask::$pooled"
          echo "direct=$direct" >> "$GITHUB_OUTPUT"
          echo "pooled=$pooled" >> "$GITHUB_OUTPUT"
      - name: Run migrations
        run: pnpm db:migrate
        env:
          NUXT_DATABASE_URL: ${{ steps.database.outputs.direct }}
      - name: Vercel deploy
        id: deployment
        uses: amondnet/vercel-action@v42.3.0
        with:
          vercel-version: 50.44.0
          vercel-args: --prod --env NUXT_DATABASE_URL=${{ steps.database.outputs.pooled }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: lilmees
      - name: Check health
        run: >-
          curl --fail-with-body --silent --show-error
          --header "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          "${{ steps.deployment.outputs.preview-url }}/api/health"
